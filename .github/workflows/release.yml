name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ ! -f "RELEASE-${GITHUB_REF_NAME}.md" ]]; then
            echo "Missing release notes: RELEASE-${GITHUB_REF_NAME}.md"
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run translation build
        run: composer translations

      - name: Run quality gate
        run: composer quality

      - name: Upload validated release artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v6
        with:
          name: voucher-manager-release-${{ github.sha }}
          path: dist/voucher-manager.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download validated release artifact
        uses: actions/download-artifact@v8
        with:
          name: voucher-manager-release-${{ github.sha }}
          path: dist

      - name: Verify release asset
        shell: bash
        run: |
          test -f dist/voucher-manager.zip
          unzip -t dist/voucher-manager.zip

      - name: Create or publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_NOTES="RELEASE-${TAG}.md"
          RELEASE_TITLE="Voucher Manager ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"

            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Release ${TAG} already exists and is already published."
              exit 1
            fi

            gh release edit "${TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RELEASE_NOTES}"

            gh release upload "${TAG}" dist/voucher-manager.zip --clobber

            gh release edit "${TAG}" \
              --draft=false \
              --latest
          else
            gh release create "${TAG}" dist/voucher-manager.zip \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RELEASE_NOTES}" \
              --latest
          fi
