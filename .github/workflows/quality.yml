name: Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install development dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.MJS_QUALITY_READ_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Run quality gate
        run: composer quality

      - name: Upload validated release artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v6
        with:
          name: mjs-productions-voucher-manager-${{ github.sha }}
          path: dist/mjs-productions-voucher-manager.zip
          if-no-files-found: error
          retention-days: 14

  localization:
    name: Localization
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.MJS_QUALITY_READ_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Install WP-CLI
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
            --output wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp i18n --help >/dev/null

      - name: Check localization artifacts
        run: composer translations:check

      - name: Validate translations
        run: composer translations:validate

  q5-distribution-atomic-claim:
    name: Q5 atomic distribution claim
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: voucher_manager_q5
          MYSQL_USER: voucher_manager
          MYSQL_PASSWORD: voucher_manager
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MJS_QUALITY_DB_HOST: 127.0.0.1
      MJS_QUALITY_DB_PORT: 3306
      MJS_QUALITY_DB_NAME: voucher_manager_q5
      MJS_QUALITY_DB_USER: voucher_manager
      MJS_QUALITY_DB_PASSWORD: voucher_manager
      WP_VERSION: "6.8.2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mysqli,pdo_mysql
          tools: composer:v2

      - name: Install development dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.MJS_QUALITY_READ_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress test runtime
        run: |
          curl --fail --location --silent --show-error \
            "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" \
            --output /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-settings.php

      - name: Run Q5 atomic distribution claim test
        env:
          MJS_QUALITY_WORDPRESS_PATH: /tmp/wordpress
        run: composer test:q5-distribution-atomic-claim
